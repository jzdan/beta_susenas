; Penyetelan produksi Sistem SUSENAS
memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 20M
max_execution_time = 120
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; impor CSV besar bisa perlu waktu
max_input_time = 120
